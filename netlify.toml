[build]
  command = "bash scripts/build-netlify.sh"
  functions = "netlify/functions"

# Use nft (Node File Trace) bundler — works better with pre-built bundles
# that have external packages in node_modules
[functions]
  node_bundler = "nft"
  included_files = ["netlify/functions/node_modules/**"]

# Route all API requests to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Health check
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/health/*"
  to = "/.netlify/functions/api/health/:splat"
  status = 200
