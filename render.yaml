services:
  - type: web
    name: supportflowbackend
    runtime: node
    plan: free
    buildCommand: npm install && NODE_OPTIONS="--max-old-space-size=1536" npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
